name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Deploy only reviewed changes on the default branch
    paths-ignore:
      - 'scripts/send-release-event.mjs'
      - '.github/workflows/discord-release.yml'

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Tests run in three groups side by side while the build job type-checks and
  # builds. Nothing goes live unless every group and the build pass (deploy
  # needs both jobs).
  test:
    name: test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test -- --shard=${{ matrix.shard }}/3

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify content
        run: npm run content:verify

      - name: Build
        # VITE_BASE makes the bundle's asset paths match the GitHub Pages
        # project URL (/<repo-name>/) — works no matter what the repo is named.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Stamps the bundle + version.json so an open tab can detect this
          # deploy and offer a reload (see components/UpdateBanner.tsx).
          BUILD_ID: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [test, build]
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
