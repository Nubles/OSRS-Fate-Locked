name: Deploy to GitHub Pages

on:
  push:
    branches: [main] # Deploy only reviewed changes on the default branch

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify content
        run: npm run content:verify

      - name: Build
        # VITE_BASE makes the bundle's asset paths match the GitHub Pages
        # project URL (/<repo-name>/) — works no matter what the repo is named.
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Stamps the bundle + version.json so an open tab can detect this
          # deploy and offer a reload (see components/UpdateBanner.tsx).
          BUILD_ID: ${{ github.sha }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
