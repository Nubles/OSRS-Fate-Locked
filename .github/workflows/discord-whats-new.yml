name: Announce What's New

# Once a push to main is live on Pages, post its new What's New entries in the
# Discord's #updates channel (scripts/send-whats-new-event.mjs).
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: discord-whats-new
  cancel-in-progress: false

jobs:
  announce:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Announce new What's New entries
        env:
          DISCORD_AUTOMATION_ENDPOINT: ${{ secrets.DISCORD_AUTOMATION_ENDPOINT }}
          DISCORD_AUTOMATION_HMAC: ${{ secrets.DISCORD_AUTOMATION_HMAC }}
        run: node --experimental-strip-types --no-warnings scripts/send-whats-new-event.mjs
