name: Announce What's New

# Once a push to main is live on Pages, post its new What's New entries in the
# Discord's #updates channel (scripts/send-whats-new-event.mjs). Entries the
# last successful run already announced are not sent again.
on:
  workflow_run:
    workflows: [Deploy to GitHub Pages]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read

concurrency:
  group: discord-whats-new
  cancel-in-progress: false

jobs:
  announce:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Find what was already announced
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow discord-whats-new.yml \
            --branch main --status success --limit 1 --json headSha --jq '.[0].headSha // empty')
          if [ -z "$previous" ]; then
            echo "No earlier announcement; the bot's own check stops repeats."
          elif git show "$previous:data/changelog.ts" > "$RUNNER_TEMP/previous-changelog.ts"; then
            echo "Leaving out entries already in $previous."
            echo "PREVIOUS_CHANGELOG=$RUNNER_TEMP/previous-changelog.ts" >> "$GITHUB_ENV"
          else
            echo "::warning::Could not read data/changelog.ts at $previous; the bot's own check stops repeats."
          fi
      - name: Announce new What's New entries
        env:
          DISCORD_AUTOMATION_ENDPOINT: ${{ secrets.DISCORD_AUTOMATION_ENDPOINT }}
          DISCORD_AUTOMATION_HMAC: ${{ secrets.DISCORD_AUTOMATION_HMAC }}
        run: node --experimental-strip-types --no-warnings scripts/send-whats-new-event.mjs
