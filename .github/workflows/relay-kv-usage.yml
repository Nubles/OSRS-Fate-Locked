name: Relay KV usage

# Every hour, read how much of the Cloudflare free plan's daily KV quota the
# relay has used today (scripts/relay-kv-usage.mjs), and past 80% open or
# update one GitHub issue, at most once a UTC day. Without the
# CLOUDFLARE_ANALYTICS_TOKEN secret it only leaves a notice and succeeds.
# Setup: docs/online-relay.md, "Daily KV quota".
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-kv-usage
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - name: Check today's KV use
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELAY_ALERT_DISCORD_WEBHOOK: ${{ secrets.RELAY_ALERT_DISCORD_WEBHOOK }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/relay-kv-usage.mjs
