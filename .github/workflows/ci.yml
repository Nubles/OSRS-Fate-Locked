name: CI

on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify player-facing What's New
        if: github.event_name == 'pull_request'
        run: npm run changelog:verify
        env:
          CHANGELOG_BASE_REF: ${{ github.event.pull_request.base.sha }}

      - name: Run tests
        run: npm test

      - name: Type-check
        run: npx tsc --noEmit

      - name: Verify content
        run: npm run content:verify

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Build RuneProof private preview
        run: npm run build:runeproof-preview
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Verify builds leave tracked source unchanged
        run: git diff --exit-code
