# Checks the tracker's game data against the OSRS Wiki every week.
#
# This workflow does the exact, machine-checkable part:
#   1. syncs the collection log and re-renders Combat Achievements,
#   2. writes docs/SYNC_STATUS.md (quest list by name, CA counts, Chunk Picker
#      movement),
#   3. runs the tests, whose failures name the follow-up curation (a new pet,
#      boss or quest that still needs its unlocks, tiers and areas).
#
# When anything changed it pushes the result to the bot/wiki-content-sync
# branch, with the report as the commit message and the job summary. It never
# opens a pull request and never touches main. When nothing changed the branch
# is deleted, so its existence alone means "something to review".
#
# Nobody reads that branch unprompted, so the workflow also tells the owner.
# While the check lists something to act on, one issue assigned to the
# repository owner carries the list: it gets a comment when something new
# joins the list and is closed when nothing is left. A content update, started
# by a maintainer, then reads the branch and the week's game update notes,
# does the curation, adds the What's New entry and opens one draft pull
# request.
#
# Three jobs, so the step that runs third-party code never holds a write
# token: `sync` installs the lockfile's dependencies, runs the wiki sync, the
# check and the tests with read-only permissions and no stored git
# credentials, and hands its results on as artifacts. `push-branch` gets the
# generated files plus the report; it runs no npm code and alone may write
# code, and only to bot/wiki-content-sync. `alert` gets the status file and
# the report; it runs one script of this repository that uses Node's own
# modules only, and may write issues and nothing else.
name: Sync content from the OSRS Wiki

on:
  schedule:
    - cron: '0 5 * * 4' # Thursdays 05:00 UTC, the morning after Wednesday's game update
  workflow_dispatch: {}  # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: wiki-content-sync
  # The weekly run and a manual run on main replace a run in progress. A
  # manual run on a curation branch waits for its turn instead, so it does not
  # cancel a weekly run that is on its way to telling the owner what it found.
  cancel-in-progress: ${{ github.event_name == 'schedule' || github.ref == 'refs/heads/main' }}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.report.outputs.changed }}
      sync_outcome: ${{ steps.sync.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync data from the wiki
        id: sync
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          npm run --silent clog:sync 2>&1 | tee "$RUNNER_TEMP/clog.txt" || status=1
          npm run --silent ca:sync 2>&1 | tee "$RUNNER_TEMP/ca.txt" || status=1
          npm run --silent content:check 2>&1 | tee "$RUNNER_TEMP/check.txt" || status=1
          exit $status

      # A manual run on a curation branch also pins the Wiki revision of every
      # new or changed quest record (scripts/sync-quest-sources.mjs --refresh),
      # which can only be fetched from here. The weekly run leaves them alone.
      - name: Refresh quest sources (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          set -o pipefail
          npm run --silent quests:source-refresh 2>&1 | tee "$RUNNER_TEMP/quests.txt"

      - name: Run tests (failures are the curation to-do list, not a gate)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee "$RUNNER_TEMP/tests.txt"

      - name: Write the report
        id: report
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          report="sync-report.md"
          strip() { sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g'; }
          {
            echo "Weekly game data check from the OSRS Wiki"
            echo ""
            echo "Sync: $SYNC_OUTCOME. Tests: $TESTS_OUTCOME."
            echo ""
            echo "## Changed files"
            git status --porcelain -- data docs | sed 's/^/- /'
            echo ""
            echo "## Collection log"
            strip < "$RUNNER_TEMP/clog.txt" | grep -E '^\s*(RENAME|ADD|MOVE|\+|\?)|\[clog:sync\] (renames|failed|WARNING|[0-9]+ NEW)' || echo "(no changes)"
            echo ""
            echo "## Freshness check"
            strip < "$RUNNER_TEMP/check.txt" | grep -E '\[content:check\]|^\s{2}' | grep -v 'wrote docs' || true
            echo ""
            if [ -f "$RUNNER_TEMP/quests.txt" ]; then
              echo "## Quest sources"
              strip < "$RUNNER_TEMP/quests.txt" | tail -5
              echo ""
            fi
            echo "## Failing tests"
            strip < "$RUNNER_TEMP/tests.txt" | grep -E '^\s*(FAIL|×)' | sort -u | head -60 || true
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain -- data docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the generated data, the quest source snapshots, the status report,
      # the CA evidence and the report text cross to the job that can write. Never the scratch logs or
      # anything else in the workspace.
      - name: Hand the synced files to the push job
        if: steps.report.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiki-content-sync
          path: |
            data/collectionLogData.ts
            data/caTasks.ts
            data/sources/quest-list.json
            data/sources/quest-requirement-audit.json
            docs/SYNC_STATUS.md
            docs/sync-evidence/
            sync-report.md
          if-no-files-found: error
          retention-days: 1

      # The alert job reads these two every week, also when no data file
      # changed: the check can list something to do without changing a file.
      # Kept for a week, so a failed alert job can be run again until the next
      # weekly run.
      - name: Hand the status and the report to the alert job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiki-content-sync-report
          path: |
            docs/SYNC_STATUS.md
            sync-report.md
          if-no-files-found: error
          retention-days: 7

  push-branch:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the synced files from the sync job
        if: needs.sync.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wiki-content-sync
          path: .

      - name: Push the result for review
        if: needs.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/wiki-content-sync
          git add data/collectionLogData.ts data/caTasks.ts docs/SYNC_STATUS.md \
            data/sources/quest-list.json data/sources/quest-requirement-audit.json
          if [ -d docs/sync-evidence ]; then git add docs/sync-evidence; fi
          git commit -F sync-report.md
          git push --force origin bot/wiki-content-sync

      - name: Clear the branch when nothing changed
        if: needs.sync.outputs.changed != 'true'
        run: git push origin --delete bot/wiki-content-sync 2>/dev/null || true

  # Tells the owner what the check found (scripts/sync-alert.mjs).
  alert:
    needs: [sync, push-branch]
    # The weekly run and a manual run on main speak for the tracker; a manual
    # run on a curation branch compares that branch, so it stays silent. The
    # alert waits for the bot branch, but a failed push does not silence it.
    if: ${{ !cancelled() && needs.sync.result == 'success' && (github.event_name == 'schedule' || github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Into a scratch folder: the script below runs from the checkout, and
      # nothing the sync job produced is unpacked over it.
      - name: Take the status and the report from the sync job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wiki-content-sync-report
          path: ${{ runner.temp }}/wiki-content-sync-report

      - name: Open, update or close the alert issue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALERT_REPORT_DIR: ${{ runner.temp }}/wiki-content-sync-report
          ALERT_SYNC_OUTCOME: ${{ needs.sync.outputs.sync_outcome }}
          ALERT_BRANCH_PUSHED: ${{ needs.sync.outputs.changed == 'true' && needs.push-branch.result == 'success' }}
        run: node scripts/sync-alert.mjs
