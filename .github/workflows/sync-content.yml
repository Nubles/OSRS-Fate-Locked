# Checks the tracker's game data against the OSRS Wiki every week.
#
# The Wiki can only be read from here (Claude's cloud sessions can't reach its
# API), so this workflow does the exact, machine-checkable part:
#   1. syncs the collection log and re-renders Combat Achievements,
#   2. writes docs/SYNC_STATUS.md (quest list by name, CA counts, Chunk Picker
#      movement),
#   3. runs the tests, whose failures name the follow-up curation (a new pet,
#      boss or quest that still needs its unlocks, tiers and areas).
#
# When anything changed it pushes the result to the bot/wiki-content-sync
# branch, with the report as the commit message and the job summary. It never
# opens a pull request and never touches main. A weekly Claude routine reads
# that branch a few hours later, reads the week's game update notes, does the
# curation, adds the What's New entry and opens one draft pull request for a
# maintainer to merge. When nothing changed the branch is deleted, so its
# existence alone means "something to review".
#
# Two jobs, so the step that runs third-party code never holds a write token:
# `sync` installs the lockfile's dependencies, runs the wiki sync, the check
# and the tests with read-only permissions and no stored git credentials, and
# hands only the generated files plus the report to `push-branch` as an
# artifact. `push-branch` runs no npm code; it alone may write, and only to
# bot/wiki-content-sync.
name: Sync content from the OSRS Wiki

on:
  schedule:
    - cron: '0 5 * * 4' # Thursdays 05:00 UTC, the morning after Wednesday's game update
  workflow_dispatch: {}  # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: wiki-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.report.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync data from the wiki
        id: sync
        continue-on-error: true
        run: |
          set -o pipefail
          status=0
          npm run --silent clog:sync 2>&1 | tee "$RUNNER_TEMP/clog.txt" || status=1
          npm run --silent ca:sync 2>&1 | tee "$RUNNER_TEMP/ca.txt" || status=1
          npm run --silent content:check 2>&1 | tee "$RUNNER_TEMP/check.txt" || status=1
          exit $status

      - name: Run tests (failures are the curation to-do list, not a gate)
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npx vitest run 2>&1 | tee "$RUNNER_TEMP/tests.txt"

      - name: Write the report
        id: report
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
        run: |
          report="sync-report.md"
          strip() { sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g'; }
          {
            echo "Weekly game data check from the OSRS Wiki"
            echo ""
            echo "Sync: $SYNC_OUTCOME. Tests: $TESTS_OUTCOME."
            echo ""
            echo "## Changed files"
            git status --porcelain -- data docs | sed 's/^/- /'
            echo ""
            echo "## Collection log"
            strip < "$RUNNER_TEMP/clog.txt" | grep -E '^\s*(RENAME|ADD|MOVE|\+|\?)|\[clog:sync\] (renames|failed|WARNING|[0-9]+ NEW)' || echo "(no changes)"
            echo ""
            echo "## Freshness check"
            strip < "$RUNNER_TEMP/check.txt" | grep -E '\[content:check\]|^\s{2}' | grep -v 'wrote docs' || true
            echo ""
            echo "## Failing tests"
            strip < "$RUNNER_TEMP/tests.txt" | grep -E '^\s*(FAIL|×)' | sort -u | head -60 || true
          } > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$(git status --porcelain -- data docs)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      # Only the generated data, the status report, the CA evidence and the
      # report text cross to the job that can write. Never the scratch logs or
      # anything else in the workspace.
      - name: Hand the synced files to the push job
        if: steps.report.outputs.changed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiki-content-sync
          path: |
            data/collectionLogData.ts
            data/caTasks.ts
            docs/SYNC_STATUS.md
            docs/sync-evidence/
            sync-report.md
          if-no-files-found: error
          retention-days: 1

  push-branch:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the synced files from the sync job
        if: needs.sync.outputs.changed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wiki-content-sync
          path: .

      - name: Push the result for review
        if: needs.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B bot/wiki-content-sync
          git add data/collectionLogData.ts data/caTasks.ts docs/SYNC_STATUS.md
          if [ -d docs/sync-evidence ]; then git add docs/sync-evidence; fi
          git commit -F sync-report.md
          git push --force origin bot/wiki-content-sync

      - name: Clear the branch when nothing changed
        if: needs.sync.outputs.changed != 'true'
        run: git push origin --delete bot/wiki-content-sync 2>/dev/null || true
