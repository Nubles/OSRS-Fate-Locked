# Keeps the DEPLOYED app's bundled game data current with the OSRS Wiki.
#
# The browser reports collection-log additions without changing catalogue or
# save identities. This workflow proposes reviewed build-time data updates and
# runs the tests before opening a pull request. New bosses and quests still
# need human curation of unlocks, requirements, models, and rewards.
#
# Flow: weekly (or manual) -> sync from wiki -> test -> open/refresh a PR ->
# dispatch CI on it. A maintainer reviews + merges; the merge pushes to main
# and the existing Deploy workflow publishes it. Nothing ships unreviewed.
#
# Two jobs, so the step that runs third-party code never holds a write token:
# `sync` installs the lockfile's dependencies, runs the wiki sync and the
# tests with read-only permissions and no stored git credentials, and hands
# the three generated files plus the PR text to `open-pr` as an artifact.
# `open-pr` runs no npm code; it alone may write, to open the PR and start CI.
name: Sync content from the OSRS Wiki

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch: {}  # manual run from the Actions tab

permissions:
  contents: read

concurrency:
  group: wiki-content-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Sync data from the wiki
        run: npm run content:sync | tee sync-output.txt

      - name: Run tests (gates the sync — must stay green to open a PR)
        run: npm test

      - name: Build the PR description from the sync log
        if: success()
        run: |
          {
            echo "Automated sync of game data from the **OSRS Wiki** (\`npm run content:sync\`)."
            echo ""
            echo "Review the data diff below, then merge to deploy. If the sync reports a"
            echo "brand-new page (e.g. a new boss), it needs manual curation — add it to the"
            echo "relevant unlock list / model / economy before or after merging."
            echo ""
            echo '```'
            cat sync-output.txt
            echo '```'
          } > pr-body.md

      # Only the generated data/report and the PR text cross to the job that
      # can write — never the scratch logs or anything else in the workspace.
      - name: Hand the synced files to the PR job
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wiki-content-sync
          path: |
            data/collectionLogData.ts
            data/caTasks.ts
            docs/SYNC_STATUS.md
            pr-body.md
          if-no-files-found: error
          retention-days: 1

  open-pr:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # dispatch CI on the sync PR branch
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Take the synced files from the sync job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wiki-content-sync
          path: .

      - name: Open or update the sync PR
        id: cpr
        if: success()
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          branch: bot/wiki-content-sync
          delete-branch: true
          # Only ever commit the generated data/report — never the PR text above.
          add-paths: |
            data/collectionLogData.ts
            data/caTasks.ts
            docs/SYNC_STATUS.md
          commit-message: "chore(data): sync collection log from the OSRS Wiki"
          title: "🔄 Sync game data from the OSRS Wiki"
          body-path: pr-body.md
          labels: data-sync

      # A pull request opened with GITHUB_TOKEN doesn't trigger other
      # workflows, so CI never ran on the sync PR. workflow_dispatch is the one
      # event GITHUB_TOKEN may start, and its checks attach to the PR's head.
      - name: Run CI on the sync PR
        if: success() && (steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "${{ github.repository }}" --ref bot/wiki-content-sync
