name: Review curated requirement freshness
on:
  schedule:
    - cron: '30 7 * * 1'
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Flag changed, unavailable and overdue requirement sources
        run: node scripts/check-requirement-freshness.mjs --upstream --output=requirement-freshness.json
      - name: Retain review evidence even when review is required
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requirement-freshness
          path: requirement-freshness.json
          if-no-files-found: error
