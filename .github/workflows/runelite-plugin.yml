name: Build RuneLite plugin

# Compiles the Fate Locked RuneLite plugin and publishes a ready-to-use jar as a
# build artifact — so nobody has to install a JDK or run Gradle by hand. Also
# acts as a compile check for the plugin's Java on every change.

on:
  push:
    branches: [main]
    paths:
      - 'runelite-plugin/**'
      - '.github/workflows/runelite-plugin.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build shadow jar
        working-directory: runelite-plugin
        run: gradle shadowJar --no-daemon

      - name: Upload plugin jar (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: fatelocked-runelite-plugin
          path: runelite-plugin/build/libs/fatelocked-*-all.jar
          if-no-files-found: error

      # Publish a permanent, one-click download so users never build anything.
      # (Sideloading still needs RuneLite's --developer-mode; the Plugin Hub is
      # the only install path that avoids that.)
      - name: Publish jar to a rolling release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: runelite-plugin-latest
          name: RuneLite plugin (latest build)
          body: |
            Auto-built Fate Locked RuneLite plugin jar.

            Install: drop the jar in `~/.runelite/sideloaded-plugins/` and launch
            RuneLite with `--developer-mode`. See `runelite-plugin/README.md`.
          prerelease: true
          files: runelite-plugin/build/libs/fatelocked-*-all.jar
