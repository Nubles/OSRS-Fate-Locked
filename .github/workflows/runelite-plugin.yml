name: Build RuneLite plugin

# Compiles the Fate Locked RuneLite plugin and publishes a ready-to-use jar as a
# build artifact — so nobody has to install a JDK or run Gradle by hand. Also
# acts as a compile check for the plugin's Java on every change.

on:
  push:
    branches: [main]
    paths:
      - 'runelite-plugin/**'
      - '.github/workflows/runelite-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build shadow jar
        working-directory: runelite-plugin
        run: gradle shadowJar --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: fatelocked-runelite-plugin
          path: runelite-plugin/build/libs/fatelocked-*-all.jar
          if-no-files-found: error
