name: Full quest operational audit

on:
  push:
    branches:
      - audit/full-quest-operational-2026-08-25
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full quest audit
        run: node scripts/run-full-quest-operational-audit.mjs

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-quest-operational-audit
          path: audit-output/
          if-no-files-found: warn
          retention-days: 7
