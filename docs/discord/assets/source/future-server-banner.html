<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; overflow: hidden; width: 960px; height: 540px; }
    body {
      background:
        radial-gradient(ellipse at 16% 88%, rgba(217, 119, 6, .28), transparent 40%),
        radial-gradient(ellipse at 85% 84%, rgba(139, 92, 246, .26), transparent 43%),
        linear-gradient(150deg, #161616, #101010 56%, #19151e);
    }
    body::before {
      position: fixed;
      inset: 48px 0 0;
      content: "";
      opacity: .28;
      background-image: linear-gradient(rgba(255,255,255,.028) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
      background-size: 32px 32px;
      mask-image: linear-gradient(to bottom, transparent, #000 25%);
    }
    body::after {
      position: fixed;
      right: 8%;
      bottom: -23%;
      width: 55%;
      height: 76%;
      content: "";
      border: 1px solid rgba(209, 213, 219, .07);
      border-radius: 50%;
      box-shadow: 0 0 0 70px rgba(209, 213, 219, .018), 0 0 0 140px rgba(209, 213, 219, .012);
      transform: rotate(-18deg);
    }
  </style>
</head>
<body></body>
</html>
