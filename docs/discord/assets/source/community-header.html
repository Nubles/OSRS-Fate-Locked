<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root {
      color-scheme: dark;
      --bg: #161616;
      --panel: #2d2d2d;
      --border: #3e3e3e;
      --gold: #fbbf24;
      --text: #d1d5db;
      --accent: #8b5cf6;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; overflow: hidden; width: 1920px; height: 1080px; }
    body {
      position: relative;
      display: flex;
      align-items: center;
      min-width: 1920px;
      min-height: 1080px;
      padding: 130px 150px 132px;
      background:
        radial-gradient(circle at 10% 23%, rgba(251, 191, 36, .13), transparent 31%),
        radial-gradient(circle at 88% 79%, rgba(139, 92, 246, .13), transparent 33%),
        var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    body::before {
      position: absolute;
      inset: 0;
      content: "";
      opacity: .24;
      pointer-events: none;
      background-image: linear-gradient(rgba(255,255,255,.024) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.018) 1px, transparent 1px);
      background-size: 42px 42px;
    }
    .composition { position: relative; display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .brand { display: flex; align-items: center; gap: 42px; }
    .key-tile {
      display: grid;
      width: 248px;
      height: 248px;
      flex: 0 0 auto;
      place-items: center;
      border: 1px solid rgba(251, 191, 36, .55);
      border-radius: 34px;
      background: linear-gradient(145deg, #d97706, #78350f);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.2), 0 20px 48px rgba(0,0,0,.42);
    }
    .key-tile img { width: 178px; height: 178px; object-fit: contain; filter: drop-shadow(0 12px 10px rgba(0,0,0,.62)); }
    .eyebrow { margin: 0 0 16px; color: var(--gold); font-size: 23px; font-weight: 800; letter-spacing: .22em; }
    h1 { max-width: 650px; margin: 0; color: #fff; font-size: 76px; font-weight: 900; letter-spacing: -.055em; line-height: .94; }
    .subtitle { margin: 22px 0 0; color: var(--text); font-size: 24px; font-weight: 700; letter-spacing: .13em; }
    .resource-panel {
      display: flex;
      align-items: stretch;
      min-width: 722px;
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(135deg, rgba(62,62,62,.9), var(--panel));
      box-shadow: 0 20px 48px rgba(0,0,0,.3);
    }
    .points { width: 288px; padding: 34px 36px 30px; }
    .label { color: var(--text); font-size: 17px; font-weight: 800; letter-spacing: .12em; }
    .point-value { display: flex; align-items: baseline; gap: 9px; margin-top: 9px; }
    .point-value strong { color: #fff; font-size: 56px; letter-spacing: -.06em; line-height: 1; }
    .point-value span { color: var(--text); font-size: 22px; font-weight: 700; }
    .meter { height: 11px; margin-top: 25px; border-radius: 999px; overflow: hidden; background: #161616; }
    .meter > span { display: block; width: 26%; height: 100%; border-radius: inherit; background: var(--gold); box-shadow: 0 0 14px rgba(251,191,36,.6); }
    .divider { width: 1px; margin: 25px 0; background: var(--border); }
    .key-counters { display: flex; align-items: center; gap: 22px; padding: 24px 30px; }
    .counter { display: flex; align-items: center; gap: 11px; min-width: 104px; }
    .counter img { width: 46px; height: 46px; object-fit: contain; filter: drop-shadow(0 5px 5px rgba(0,0,0,.5)); }
    .counter-text { display: grid; gap: 3px; }
    .counter-text span { color: var(--text); font-size: 13px; font-weight: 800; letter-spacing: .075em; }
    .counter-text strong { color: #fff; font-size: 29px; line-height: 1; }
    footer { position: absolute; right: 150px; bottom: 58px; left: 150px; color: #9ca3af; font-size: 15px; font-weight: 700; letter-spacing: .09em; text-align: center; }
  </style>
</head>
<body>
  <main class="composition">
    <section class="brand" aria-label="Fate Locked Ironman">
      <div class="key-tile"><img src="./crystal-key.png" alt="Crystal key"></div>
      <div>
        <p class="eyebrow">FATE LOCKED IRONMAN</p>
        <h1>FATE LOCKED<br>IRONMAN</h1>
        <p class="subtitle">RNG EDITION COMMAND CENTER</p>
      </div>
    </section>
    <section class="resource-panel" aria-label="Resource progress">
      <div class="points">
        <div class="label">FATE POINTS</div>
        <div class="point-value"><strong>13</strong><span>/50</span></div>
        <div class="meter" aria-label="26 percent complete"><span></span></div>
      </div>
      <div class="divider"></div>
      <div class="key-counters">
        <div class="counter"><img src="./crystal-key.png" alt="Standard key"><div class="counter-text"><span>STANDARD</span><strong>14</strong></div></div>
        <div class="counter"><img src="./enhanced-crystal-key.png" alt="Omni key"><div class="counter-text"><span>OMNI</span><strong>1</strong></div></div>
        <div class="counter"><img src="./sinister-key.png" alt="Chaos key"><div class="counter-text"><span>CHAOS</span><strong>2</strong></div></div>
      </div>
    </section>
  </main>
  <footer>OFFICIAL COMMUNITY FOR THE FAN-MADE MODE · NOT AFFILIATED WITH JAGEX</footer>
</body>
</html>
