
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fate Locked Ironman</title>
    <meta name="description" content="Fate Locked Ironman — an OSRS challenge-run tracker where every unlock is decided by fate. Earn keys from quests, slayer and clues, then gamble them on random gear, skill, region and boss unlocks." />
    <meta name="theme-color" content="#161616" />

    <!-- Social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Fate Locked Ironman" />
    <meta property="og:description" content="An OSRS challenge-run tracker where every unlock is decided by fate. Earn keys, spend them on random unlocks, and track the whole run." />

    <!-- Emoji favicon (inline SVG — no binary asset needed) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗝️</text></svg>" />

    <!-- The app fetches item/monster icons and prices from the OSRS wiki at
         runtime; warming the connections saves a TLS round-trip on first use. -->
    <link rel="preconnect" href="https://oldschool.runescape.wiki" crossorigin />
    <link rel="dns-prefetch" href="https://oldschool.runescape.wiki" />
    <link rel="preconnect" href="https://prices.runescape.wiki" crossorigin />
    <link rel="dns-prefetch" href="https://prices.runescape.wiki" />
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
