allprojects {
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == 'net.runelite' && ['client', 'jshell', 'runelite-api', 'injected-client'].contains(details.requested.name)) {
                details.useVersion '1.12.38'
                details.because 'RuneProof export uses the dependency revision recorded in its source manifest'
            }
        }
    }
}
